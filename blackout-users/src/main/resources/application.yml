server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: blackout-users
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:users_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    properties:
      mail.smtp:
        auth: true
        starttls.enable: true
        starttls.required: true
        connectiontimeout: 5000
        timeout: 10000
        writetimeout: 10000
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:blackout}
    password: ${RABBITMQ_PASSWORD:blackout-local}
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3001}
  security:
    entra-issuer: ${ENTRA_ISSUER:}
    entra-audience: ${ENTRA_AUDIENCE:}
    entra-scope: ${ENTRA_SCOPE:access_as_user}
    cognito-issuer: ${COGNITO_ISSUER:}
    cognito-client-id: ${COGNITO_CLIENT_ID:}
  rabbit:
    enabled: ${RABBITMQ_ENABLED:true}
    events-exchange: blackout.events.exchange
    dead-letter-exchange: blackout.dead-letter.exchange
    queues:
      fan-notifications: fan.notifications.queue
      fan-notifications-dlq: fan.notifications.dlq
    routing:
      fan-notifications: tournament.#
      fan-notifications-dlq: fan.notifications.failed
      tournament-created: tournament.created
    max-retries: 3
springdoc:
  swagger-ui:
    path: /swagger-ui.html

academy:
  cognito-userinfo-url: ${ACADEMY_COGNITO_USERINFO_URL:}
  mail-consumer-enabled: ${ACADEMY_MAIL_CONSUMER_ENABLED:false}
  mail-from: ${ACADEMY_MAIL_FROM:}
